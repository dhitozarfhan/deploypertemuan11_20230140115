<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Praktikum 11</a>
        <div class="collapse navbar-collapse justify-content-end">
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="alert alert-info text-center">
                <h4 class="mb-0">Selamat Datang, <strong th:text="${profile.nama}">User</strong>!</h4>
            </div>
            <div class="card mt-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Data Profil Anda</h5>
                </div>
                <div class="card-body">
                    <table class="table table-borderless mb-0">
                        <tbody>
                        <tr>
                            <th scope="row" style="width: 30%">Username</th>
                            <td th:text="${user.username}">-</td>
                        </tr>
                        <tr>
                            <th scope="row">Nama Lengkap</th>
                            <td th:text="${profile.nama}">-</td>
                        </tr>
                        <tr>
                            <th scope="row">Alamat</th>
                            <td th:text="${profile.alamat}">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
